services:
  - type: web
    name: transit-nexus
    runtime: php
    phpVersion: "8.2"
    plan: free
    buildCommand: |
      composer install --no-dev --no-interaction --prefer-dist &&
      npm install &&
      npm run build &&
      php artisan key:generate &&
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: MAIL_DRIVER
        value: log
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
