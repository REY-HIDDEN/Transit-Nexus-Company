services:
  - type: web
    name: transit-nexus
    runtime: php
    plan: free
    buildCommand: composer install && npm install && npm run build && php artisan migrate
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        scope: build
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
