services:
  - type: web
    name: transit-nexus
    runtime: php
    phpVersion: "8.2"
    plan: free
    buildCommand: |
      composer install --no-interaction --prefer-dist &&
      npm install &&
      npm run build &&
      php artisan config:cache
    startCommand: |
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: "Transit Nexus"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:xz9AumCkl8pRaon+GcgftYKMlqPsGV0EwrKHWAoqxHQ=
      - key: APP_URL
        value: https://transit-nexus.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: lizikijeanpaul@gmail.com
      - key: MAIL_PASSWORD
        value: dqkbuumrhhpbdmdp
      - key: MAIL_FROM_ADDRESS
        value: lizikijeanpaul@gmail.com
      - key: MAIL_FROM_NAME
        value: "Transit Nexus Company"
