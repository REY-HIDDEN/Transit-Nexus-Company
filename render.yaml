services:
  - type: web
    name: transit-nexus
    runtime: php
    phpVersion: "8.2"
    plan: free
    buildCommand: >
      composer install --no-interaction --prefer-dist --no-dev &&
      touch database/database.sqlite &&
      php artisan config:cache &&
      php artisan migrate --force
    startCommand: php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_NAME
        value: "Transit Nexus"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:xz9AumCkl8pRaon+GcgftYKMlqPsGV0EwrKHWAoqxHQ=
      - key: APP_URL
        value: https://transit-nexus.onrender.com
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: 120
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: lizikijeanpaul@gmail.com
      - key: MAIL_PASSWORD
        value: dqkbuumrhhpbdmdp
      - key: MAIL_FROM_ADDRESS
        value: lizikijeanpaul@gmail.com
      - key: MAIL_FROM_NAME
        value: "Transit Nexus Company"
      - key: BCRYPT_ROUNDS
        value: 12
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
